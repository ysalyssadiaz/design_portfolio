<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Your Portfolio</title>

    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Iansui&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- MENU -->
    <div class="menu" id="menu">
      <div class="menu-panel">
        <div class="menu-text">
          <p>Email: your@email.com</p>
          <p>LinkedIn: your-linkedin</p>
        </div>

        <div class="menu-handle" onclick="toggleMenu()">
          <img src="images/homepage/menudrop.png" alt="Menu" />
        </div>
      </div>
    </div>

    <!-- INTRO -->
    <div class="intro">
      <img
        src="images/homepage/introbox.png"
        alt="Intro Box"
        class="intro-box"
      />

      <div class="intro-text">
        <p>
          is a digital designer focused on crafting immersive storytelling
          environments.
        </p>
      </div>
    </div>

    <!-- PROJECTS -->
    <h2 class="projects-title">Projects</h2>

    <div class="projects-grid">
      <a href="project1.html" class="project-card">
        <img src="images/homepage/elsewhere_thumbnail.png" alt="Project 1" />
        <div class="project-info">
          <h3>Elsewhere</h3>
          <p>Finding belonging and peace in solitude.</p>
        </div>
      </a>

      <a href="project2.html" class="project-card">
        <img src="images/project2.png" alt="Project 2" />
        <div class="project-info">
          <h3>Project Title 2</h3>
          <p>Type of Project</p>
        </div>
      </a>

      <a href="project3.html" class="project-card">
        <img src="images/project3.png" alt="Project 3" />
        <div class="project-info">
          <h3>Project Title 3</h3>
          <p>Type of Project</p>
        </div>
      </a>

      <a href="project4.html" class="project-card">
        <img src="images/project4.png" alt="Project 4" />
        <div class="project-info">
          <h3>Project Title 4</h3>
          <p>Type of Project</p>
        </div>
      </a>
    </div>

    <!-- SCRIPT (MUST BE INSIDE BODY) -->
    <script src="script.js"></script>

    <script>
      function toggleMenu() {
        document.getElementById("menu").classList.toggle("open");
      }
    </script>
  </body>
</html>
